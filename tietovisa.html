<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div id="site-nav"></div>
    <script src="version.js"></script>
    <script src="nav.js"></script>

    <main class="container mx-auto mt-8 px-4">
      <div class="bg-white rounded-xl shadow-md p-8">
        <div class="mb-8 overflow-hidden rounded-3xl bg-gray-100 shadow-sm group relative">
          <img src="img/quiz.png" alt="Quiz banner" class="h-64 w-full object-cover transition duration-500 group-hover:scale-105" />
          <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 transition duration-500 group-hover:opacity-100"></div>
        </div>
        <h2 class="text-4xl font-bold text-gray-800 mb-4">Quiz</h2>
        <p class="text-gray-600 leading-relaxed mb-6">
          Explore 10 multiple-choice questions about AI, cloud computing, sustainable game development, prompt thinking, and the future of gaming.
          Answer them all and see your score at the end.
        </p>

        <div id="quiz-container" class="space-y-6">
          <div class="rounded-xl border border-gray-200 bg-gray-50 p-6 shadow-sm">
            <div class="mb-4 text-sm font-semibold text-gray-600" id="question-number">Question 1 of 10</div>
            <div class="text-xl font-semibold text-gray-900 mb-6" id="question-text"></div>
            <ul id="choices-list"></ul>
          </div>

          <button id="next-button" class="inline-flex items-center justify-center rounded-full bg-indigo-600 px-6 py-3 text-sm font-semibold text-white hover:bg-indigo-500 transition disabled:opacity-50" disabled>
            Next
          </button>
        </div>

        <div id="score-container" class="hidden rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
          <h3 class="text-3xl font-bold text-gray-800 mb-4">Quiz Complete</h3>
          <p class="text-gray-700 mb-6" id="score-text"></p>
          <button id="restart-button" class="inline-flex items-center justify-center rounded-full bg-green-600 px-6 py-3 text-sm font-semibold text-white hover:bg-green-500 transition">
            Restart Quiz
          </button>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
    <script src="version.js"></script>
    <script src="nav.js"></script>
    <script src="quiz.js"></script>
    <script src="footer.js"></script>
  </body>
</html>
